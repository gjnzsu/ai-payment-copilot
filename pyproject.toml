[project]
name = "ai-payment-copilot"
version = "0.1.0"
description = "Streamlit PoC for AI-assisted payment exception investigation."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
